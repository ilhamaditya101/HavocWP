# CustomWeapon - Paper 1.21.1
resource-pack:
  enabled: true
  # Ganti dengan domain/IP publik server + port plugin. Contoh: http://play.example.com:8765/pack.zip
  public-url: "http://CHANGE-ME:8765/pack.zip"
  host: "0.0.0.0"
  port: 8765
  required: false

